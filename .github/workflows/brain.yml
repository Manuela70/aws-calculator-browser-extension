# Verificación y despliegue del cerebro u4-mapping-brain
# (infrastructure-design/cicd-pipeline.md). Un solo entorno (prod) en us-east-1.
# Identidad: OIDC con dos roles (github-brain-build y github-brain-deploy); ninguna
# credencial guardada en GitHub. Las variables del repositorio guardan datos no
# secretos: cuenta, región y ARN de los roles. El correo de
# alarmas va como secreto ALARM_EMAIL solo para que quede enmascarado en los logs,
# que son públicos en un repo público.
name: brain

on:
  push:
    branches: [main]
    paths:
      - "brain/**"
      - "infra/**"
      - "tests/u4/**"
      - ".github/workflows/brain.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Etiqueta de imagen ya publicada en ECR para redesplegar (rollback). Vacío = construir la del commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: brain-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  GITLEAKS_VERSION: 8.21.2
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  CDK_CONTEXT: >-
    -c account=${{ vars.AWS_ACCOUNT_ID }}
    -c region=${{ vars.AWS_REGION }}
    -c costInputs=cost-inputs.json
    -c alarmEmail=${{ secrets.ALARM_EMAIL }}
    -c extensionId=${{ vars.EXTENSION_ID }}
    -c cognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}
    -c githubRepo=${{ github.repository }}
    ${{ vars.BEDROCK_ROLE_ARN && format('-c bedrockRoleArn={0}', vars.BEDROCK_ROLE_ARN) || '' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Acciones oficiales fijadas por SHA de commit (tag entre comentarios), como en ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            brain/package-lock.json
            infra/package-lock.json
      - name: Instalar dependencias (raíz, brain, infra)
        run: |
          npm ci
          npm ci --prefix brain
          npm ci --prefix infra
      - name: Escaneo de secretos (gitleaks, binario verificado por SHA-256)
        env:
          GITLEAKS_SHA256: ${{ vars.GITLEAKS_SHA256 }}
        run: |
          if [ -z "$GITLEAKS_SHA256" ]; then
            echo "Falta la variable GITLEAKS_SHA256 (suma publicada para gitleaks ${GITLEAKS_VERSION} linux_x64)." >&2
            exit 1
          fi
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: Lint
        run: npm run lint
      - name: Pruebas del cerebro con umbral de 80 % (líneas y ramas) sobre brain/core
        run: npx vitest run tests/u4 --coverage --coverage.include="brain/core/**"
      - name: Síntesis de CDK con entradas de ejemplo (sin credenciales)
        working-directory: infra
        run: >-
          npx cdk synth --no-notices --quiet --no-lookups
          -c account=111111111111 -c region=us-east-1
          -c costInputs=cost-inputs.example.json -c params=deploy-params.example.json

  image:
    needs: verify
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Credenciales temporales (github-brain-build)
        run: bash infra/scripts/gha-assume-role.sh "${{ vars.BRAIN_BUILD_ROLE_ARN }}" "${{ vars.AWS_REGION }}"
      - name: Construir y publicar la imagen ARM64 (etiqueta = SHA de git)
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          # Manifiesto de imagen simple (sin índice OCI de atestaciones): ECR lo escanea y
          # Lambda lo acepta.
          docker build --platform linux/arm64 --provenance=false --sbom=false \
            -t "$REGISTRY/brain-api:$IMAGE_TAG" brain/
          docker push "$REGISTRY/brain-api:$IMAGE_TAG"
      - name: Esperar el escaneo de ECR y bloquear hallazgos críticos o altos
        run: |
          # El escaneo al subir tarda unos segundos en registrarse; antes de eso el
          # waiter falla con ScanNotFoundException.
          for attempt in $(seq 1 30); do
            if aws ecr describe-image-scan-findings --repository-name brain-api \
              --image-id imageTag="$IMAGE_TAG" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          aws ecr wait image-scan-complete --repository-name brain-api --image-id imageTag="$IMAGE_TAG"
          counts=$(aws ecr describe-image-scan-findings --repository-name brain-api \
            --image-id imageTag="$IMAGE_TAG" --query 'imageScanFindings.findingSeverityCounts' --output json)
          echo "Hallazgos: $counts"
          critical=$(echo "$counts" | jq '(.CRITICAL // 0) + (.HIGH // 0)')
          if [ "$critical" -gt 0 ]; then
            echo "La imagen tiene hallazgos críticos o altos." >&2
            exit 1
          fi

  diff:
    needs: [verify, image]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix infra
      - name: Credenciales temporales (github-brain-build)
        run: bash infra/scripts/gha-assume-role.sh "${{ vars.BRAIN_BUILD_ROLE_ARN }}" "${{ vars.AWS_REGION }}"
      - name: Verificar que el modelo de brain/config.json exista y esté activo
        env:
          BEDROCK_ROLE_ARN: ${{ vars.BEDROCK_ROLE_ARN }}
        run: |
          model_id=$(jq -r '.model.modelId' brain/config.json)
          model_region=$(jq -r '.model.region' brain/config.json)
          echo "Modelo configurado: $model_id ($model_region)"
          # Bedrock en otra cuenta: la consulta se hace con el rol de esa cuenta, en un
          # subshell para no tocar las credenciales que usa el cdk diff siguiente.
          if [ -n "$BEDROCK_ROLE_ARN" ]; then
            creds=$(aws sts assume-role --role-arn "$BEDROCK_ROLE_ARN" \
              --role-session-name brain-model-check --query Credentials --output json)
            export AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r .AccessKeyId)
            export AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r .SecretAccessKey)
            export AWS_SESSION_TOKEN=$(echo "$creds" | jq -r .SessionToken)
            echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
            echo "::add-mask::$AWS_SESSION_TOKEN"
          fi
          if [[ "$model_id" =~ ^(us|eu|apac|global)\. ]]; then
            status=$(aws bedrock get-inference-profile --region "$model_region" \
              --inference-profile-identifier "$model_id" --query status --output text)
            test "$status" = "ACTIVE" || { echo "Perfil de inferencia no activo: $status"; exit 1; }
          else
            details=$(aws bedrock get-foundation-model --region "$model_region" \
              --model-identifier "$model_id" --output json)
            lifecycle=$(echo "$details" | jq -r '.modelDetails.modelLifecycle.status')
            on_demand=$(echo "$details" | jq -r '.modelDetails.inferenceTypesSupported | index("ON_DEMAND") != null')
            test "$lifecycle" = "ACTIVE" || { echo "Modelo no activo: $lifecycle"; exit 1; }
            test "$on_demand" = "true" || { echo "El modelo no admite invocación bajo demanda directa; usa su perfil de inferencia."; exit 1; }
          fi
      - name: cdk diff (informativo para el aprobador)
        working-directory: infra
        run: |
          npx cdk diff BrainStack --no-notices $CDK_CONTEXT -c imageTag="$IMAGE_TAG" 2>&1 | tee diff.txt
          {
            echo "## cdk diff de BrainStack (imagen $IMAGE_TAG)"
            echo '```'
            cat diff.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    needs: diff
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix infra
      - name: Credenciales temporales (github-brain-deploy)
        run: bash infra/scripts/gha-assume-role.sh "${{ vars.BRAIN_DEPLOY_ROLE_ARN }}" "${{ vars.AWS_REGION }}"
      - name: cdk deploy (la aprobación ya ocurrió en el entorno production)
        working-directory: infra
        run: npx cdk deploy BrainStack --no-notices --require-approval never $CDK_CONTEXT -c imageTag="$IMAGE_TAG"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Credenciales temporales (github-brain-deploy)
        run: bash infra/scripts/gha-assume-role.sh "${{ vars.BRAIN_DEPLOY_ROLE_ARN }}" "${{ vars.AWS_REGION }}"
      - name: Verificar /health por la Function URL (corre el job si aún no hay inventario)
        run: |
          url=$(aws lambda get-function-url-config --function-name brain-api --query FunctionUrl --output text)
          health() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${url%/}/health"; }
          status=$(health)
          echo "/health: $status"
          if [ "$status" = "503" ]; then
            echo "Sin inventario todavía (primer despliegue): se corre brain-inventory-job una vez."
            aws lambda invoke --function-name brain-inventory-job --cli-read-timeout 900               --payload '{}' --cli-binary-format raw-in-base64-out job.json >/dev/null
            cat job.json
          fi
          for attempt in 1 2 3 4 5; do
            status=$(health)
            echo "Intento ${attempt}: /health $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "/health no respondió 200." >&2
          exit 1
